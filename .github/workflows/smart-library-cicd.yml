name: Smart Library CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/smart-library-cicd.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker version

          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Python Syntax Check
        shell: bash
        run: |
          echo "=== PYTHON SYNTAX CHECK ==="

          docker run --rm \
            -v "$(pwd)/backend:/workspace" \
            -w /workspace \
            python:3.11-slim \
            python -m py_compile app.py

          echo "Python syntax OK"

      - name: Build Backend Image
        shell: bash
        run: |
          echo "=== BUILDING BACKEND ==="

          docker build --no-cache \
            -t ai-smart-library-backend:latest \
            ./backend

          echo "Backend image build SUCCESS"

      - name: Test Backend Container
        shell: bash
        run: |
          echo "=== START BACKEND ==="

          docker rm -f smart-library-backend-ci 2>/dev/null || true

          docker run -d \
            --name smart-library-backend-ci \
            -p 5001:5000 \
            ai-smart-library-backend:latest

          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl -fsS http://localhost:5001/api/health >/dev/null 2>&1; then
              echo "Backend health check SUCCESS"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Backend health check FAILED"
              docker logs smart-library-backend-ci || true
              exit 1
            fi

            sleep 2
          done

          curl -fsS http://localhost:5001/api/health
          echo

      - name: Cleanup Backend Test Container
        if: always()
        shell: bash
        run: |
          docker rm -f smart-library-backend-ci 2>/dev/null || true


  frontend-build:
    name: Frontend Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Image
        shell: bash
        run: |
          echo "=== BUILDING FRONTEND ==="

          docker build --no-cache \
            -t ai-smart-library-frontend:latest \
            ./frontend

          echo "Frontend image build SUCCESS"

      - name: Verify Frontend Files
        shell: bash
        run: |
          echo "=== VERIFY FRONTEND FILES ==="

          docker run --rm \
            ai-smart-library-frontend:latest \
            sh -c "
              test -f /usr/share/nginx/html/index.html &&
              test -f /usr/share/nginx/html/login.html &&
              test -f /usr/share/nginx/html/register.html
            "

          echo "Frontend HTML files SUCCESS"

      - name: Test Frontend Container
        shell: bash
        run: |
          echo "=== START FRONTEND ==="

          docker rm -f smart-library-frontend-ci 2>/dev/null || true

          docker run -d \
            --name smart-library-frontend-ci \
            -p 8081:80 \
            ai-smart-library-frontend:latest

          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8081/ >/dev/null 2>&1; then
              echo "Frontend health check SUCCESS"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Frontend health check FAILED"
              docker logs smart-library-frontend-ci || true
              exit 1
            fi

            sleep 2
          done

          echo "=== TEST INDEX ==="
          curl -fsS -o /dev/null http://localhost:8081/

          echo "=== TEST LOGIN ==="
          curl -fsS -o /dev/null http://localhost:8081/login.html

          echo "=== TEST REGISTER ==="
          curl -fsS -o /dev/null http://localhost:8081/register.html

          echo "Frontend pages SUCCESS"

      - name: Cleanup Frontend Test Container
        if: always()
        shell: bash
        run: |
          docker rm -f smart-library-frontend-ci 2>/dev/null || true


  cleanup:
    name: Docker Cleanup
    runs-on: self-hosted

    needs:
      - backend-build
      - frontend-build

    if: always()

    steps:
      - name: Docker Cleanup
        shell: bash
        run: |
          echo "=== DOCKER DISK USAGE BEFORE CLEANUP ==="
          docker system df

          echo "=== REMOVE STOPPED CONTAINERS ==="
          docker container prune -f

          echo "=== REMOVE UNUSED BUILD CACHE ==="
          docker builder prune -af

          echo "=== REMOVE UNUSED NETWORKS ==="
          docker network prune -f

          echo "=== REMOVE DANGLING IMAGES ONLY ==="
          docker image prune -f

          echo "=== DOCKER DISK USAGE AFTER CLEANUP ==="
          docker system df

          echo "=== RUNNING CONTAINERS ==="
          docker ps
