name: Smart Library CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  changes:
    name: Detect Changes
    runs-on: self-hosted

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mysql: ${{ steps.filter.outputs.mysql }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changed Components
        id: filter
        shell: bash
        run: |
          git fetch origin main --depth=2 || true

          if git diff --name-only HEAD^ HEAD | grep -qE '^backend/|^\.github/workflows/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only HEAD^ HEAD | grep -qE '^frontend/|^\.github/workflows/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only HEAD^ HEAD | grep -qE '^(mysql/|docker-compose.*\.ya?ml$|.*mysql.*\.ya?ml$)'; then
            echo "mysql=true" >> "$GITHUB_OUTPUT"
          else
            echo "mysql=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== CHANGE DETECTION ==="
          echo "Backend: ${{ steps.filter.outputs.backend }}"
          echo "Frontend: ${{ steps.filter.outputs.frontend }}"
          echo "MySQL: ${{ steps.filter.outputs.mysql }}"


  backend-build:
    name: Backend Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker version

          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Python Syntax Check
        shell: bash
        run: |
          echo "=== PYTHON SYNTAX CHECK ==="

          BACKEND_PATH="$(pwd -W)/backend"

          echo "Backend path:"
          echo "$BACKEND_PATH"

          MSYS_NO_PATHCONV=1 docker run --rm \
            -v "$BACKEND_PATH:/workspace" \
            -w /workspace \
            python:3.11-slim \
            python -m py_compile app.py

          echo "Python syntax OK"

      - name: Build Backend Image
        shell: bash
        run: |
          echo "=== BUILDING BACKEND ==="

          docker build \
            -t ai-smart-library-backend:latest \
            ./backend

          echo "Backend image build SUCCESS"

      - name: Test Backend Container
        shell: bash
        run: |
          echo "=== START BACKEND TEST ==="

          docker rm -f smart-library-backend-ci 2>/dev/null || true

          docker run -d \
            --name smart-library-backend-ci \
            -p 5001:5000 \
            -e DB_HOST="${DB_HOST:-smart-library-mysql}" \
            -e DB_PORT="${DB_PORT:-3306}" \
            -e DB_NAME="${DB_NAME:-smart_library}" \
            -e DB_USER="${DB_USER:-library_user}" \
            -e DB_PASSWORD="${DB_PASSWORD:-}" \
            -e JWT_SECRET="${JWT_SECRET:-ci-test-secret}" \
            -e JWT_EXPIRATION_HOURS="${JWT_EXPIRATION_HOURS:-24}" \
            ai-smart-library-backend:latest

          echo "Waiting for backend..."

          for i in {1..30}; do

            if curl -fsS \
              http://localhost:5001/api/health \
              >/dev/null 2>&1; then

              echo "Backend health check SUCCESS"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Backend health check FAILED"
              docker logs smart-library-backend-ci || true
              exit 1
            fi

            sleep 2
          done

          echo "=== BACKEND HEALTH ==="
          curl -fsS http://localhost:5001/api/health
          echo

      - name: Cleanup Backend Test Container
        if: always()
        shell: bash
        run: |
          docker rm -f smart-library-backend-ci 2>/dev/null || true


  frontend-build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Frontend Files
        shell: bash
        run: |
          echo "=== FRONTEND FILES ==="
          find frontend -maxdepth 2 -type f -print

      - name: Build Frontend Image
        shell: bash
        run: |
          echo "=== BUILDING FRONTEND ==="

          docker build \
            -t ai-smart-library-frontend:latest \
            ./frontend

          echo "Frontend build SUCCESS"

      - name: Test Frontend Container
        shell: bash
        run: |
          echo "=== START FRONTEND TEST ==="

          docker rm -f smart-library-frontend-ci 2>/dev/null || true

          docker run -d \
            --name smart-library-frontend-ci \
            -p 8081:80 \
            ai-smart-library-frontend:latest

          echo "Waiting for frontend..."

          for i in {1..20}; do

            if curl -fsS \
              http://localhost:8081/ \
              >/dev/null 2>&1; then

              echo "Frontend health check SUCCESS"
              break
            fi

            if [ "$i" -eq 20 ]; then
              echo "Frontend health check FAILED"
              docker logs smart-library-frontend-ci || true
              exit 1
            fi

            sleep 2
          done

          echo "=== FRONTEND ROOT ==="
          curl -fsS -I http://localhost:8081/

          echo "=== LOGIN PAGE ==="
          curl -fsS -I http://localhost:8081/login.html

          echo "=== REGISTER PAGE ==="
          curl -fsS -I http://localhost:8081/register.html

      - name: Cleanup Frontend Test Container
        if: always()
        shell: bash
        run: |
          docker rm -f smart-library-frontend-ci 2>/dev/null || true


  mysql-check:
    name: MySQL Check
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check MySQL Configuration
        shell: bash
        run: |
          echo "=== MYSQL CHANGE DETECTED ==="

          if [ -f docker-compose.yml ]; then
            echo "docker-compose.yml found"
          fi

          if [ -f docker-compose.yaml ]; then
            echo "docker-compose.yaml found"
          fi

          if [ -d mysql ]; then
            echo "mysql directory found"
            find mysql -maxdepth 2 -type f -print
          fi

          echo "MySQL configuration check completed"


  cleanup:
    name: Docker Cleanup
    needs:
      - backend-build
      - frontend-build
      - mysql-check
    if: always()
    runs-on: self-hosted

    steps:
      - name: Docker Cleanup
        shell: bash
        run: |
          echo "=== DOCKER DISK USAGE BEFORE CLEANUP ==="
          docker system df

          echo "=== REMOVE STOPPED CONTAINERS ==="
          docker container prune -f

          echo "=== REMOVE UNUSED BUILD CACHE ==="
          docker builder prune -af

          echo "=== REMOVE UNUSED NETWORKS ==="
          docker network prune -f

          echo "=== REMOVE DANGLING IMAGES ONLY ==="
          docker image prune -f

          echo "=== DOCKER DISK USAGE AFTER CLEANUP ==="
          docker system df

          echo "=== RUNNING CONTAINERS ==="
          docker ps
