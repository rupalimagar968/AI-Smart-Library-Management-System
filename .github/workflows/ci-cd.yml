name: Smart Library CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: |
          docker --version
          docker info --format "Docker Server: {{.ServerVersion}}"

      - name: Build Backend Image
        shell: powershell
        run: |
          docker build -t ai-smart-library-backend:latest ./backend

      - name: Remove Old Backend Container
        shell: powershell
        run: |
          $container = docker ps -aq -f "name=^smart-library-backend$"
          if ($container) {
              docker rm -f smart-library-backend
          }
          exit 0

      - name: Start Backend Container
        shell: powershell
        run: |
          docker run -d `
            --name smart-library-backend `
            -p 5000:5000 `
            ai-smart-library-backend:latest

      - name: Wait for Backend
        shell: powershell
        run: |
          $maxAttempts = 30

          for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:5000/health" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Backend is healthy."
                      exit 0
                  }
              }
              catch {
                  Write-Host "Backend not ready. Attempt $i/$maxAttempts"
              }

              Start-Sleep -Seconds 2
          }

          Write-Host "Backend failed health check."
          docker ps -a
          docker logs smart-library-backend
          exit 1

      - name: Backend Health Check
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:5000/health" `
            -UseBasicParsing

          Write-Host $response.Content

      - name: Backend Container Status
        if: always()
        shell: powershell
        run: |
          docker ps -a

      - name: Backend Logs On Failure
        if: failure()
        shell: powershell
        run: |
          docker logs smart-library-backend


  frontend-build:
    name: Frontend Build
    runs-on: self-hosted
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: |
          docker --version
          docker info --format "Docker Server: {{.ServerVersion}}"

      - name: Build Frontend Image
        shell: powershell
        run: |
          docker build -t ai-smart-library-frontend:latest ./frontend

      - name: Remove Old Frontend Container
        shell: powershell
        run: |
          $container = docker ps -aq -f "name=^smart-library-frontend$"
          if ($container) {
              docker rm -f smart-library-frontend
          }
          exit 0

      - name: Start Frontend Container
        shell: powershell
        run: |
          docker run -d `
            --name smart-library-frontend `
            -p 8080:80 `
            ai-smart-library-frontend:latest

      - name: Wait for Frontend
        shell: powershell
        run: |
          $maxAttempts = 30

          for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:8080" `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Frontend is healthy."
                      exit 0
                  }
              }
              catch {
                  Write-Host "Frontend not ready. Attempt $i/$maxAttempts"
              }

              Start-Sleep -Seconds 2
          }

          Write-Host "Frontend failed health check."
          docker ps -a
          docker logs smart-library-frontend
          exit 1

      - name: Frontend Health Check
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:8080" `
            -UseBasicParsing

          Write-Host "Frontend HTTP Status: $($response.StatusCode)"

      - name: Frontend Container Status
        if: always()
        shell: powershell
        run: |
          docker ps -a

      - name: Frontend Logs On Failure
        if: failure()
        shell: powershell
        run: |
          docker logs smart-library-frontend
