name: Smart Library CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-library-main
  cancel-in-progress: true

jobs:

  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: docker --version

      - name: Stop Existing Backend
        shell: powershell
        run: |
          docker rm -f smart-library-backend 2>$null
          exit 0

      - name: Build Backend Image
        shell: powershell
        run: |
          docker build -t ai-smart-library-backend:latest ./backend

      - name: Start Backend Container
        shell: powershell
        run: |
          docker run -d `
            --name smart-library-backend `
            -p 5000:5000 `
            ai-smart-library-backend:latest

      - name: Wait for Backend
        shell: powershell
        run: |
          Start-Sleep -Seconds 10

      - name: Backend Health Check
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:5000/health" `
            -UseBasicParsing

          Write-Host $response.Content

          if ($response.StatusCode -ne 200) {
            throw "Backend health check failed"
          }

      - name: Backend Container Status
        if: always()
        shell: powershell
        run: |
          docker ps -a
          docker logs smart-library-backend 2>&1
          exit 0


  frontend-build:
    name: Frontend Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker
        shell: powershell
        run: docker --version

      - name: Stop Existing Frontend
        shell: powershell
        run: |
          docker rm -f smart-library-frontend 2>$null
          exit 0

      - name: Build Frontend Image
        shell: powershell
        run: |
          docker build -t ai-smart-library-frontend:latest ./frontend

      - name: Start Frontend Container
        shell: powershell
        run: |
          docker run -d `
            --name smart-library-frontend `
            -p 8080:80 `
            ai-smart-library-frontend:latest

      - name: Wait for Frontend
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

      - name: Frontend Health Check
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:8080/" `
            -UseBasicParsing

          Write-Host "Frontend Status: $($response.StatusCode)"

          if ($response.StatusCode -ne 200) {
            throw "Frontend health check failed"
          }

      - name: Frontend Container Status
        if: always()
        shell: powershell
        run: |
          docker ps -a
          docker logs smart-library-frontend 2>&1
          exit 0


  deployment-status:
    name: Deployment Status
    runs-on: self-hosted
    needs:
      - backend-build
      - frontend-build

    steps:
      - name: Deployment Successful
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host " Smart Library Deployment Successful"
          Write-Host "===================================="

          docker ps
