name: Smart Library CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version
          echo "=== DOCKER SERVER ==="
          docker version --format 'Docker Server: {{.Server.Version}}'
          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Python syntax check
        shell: bash
        run: |
          echo "=== PYTHON SYNTAX CHECK ==="
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            python:3.11-slim \
            python -m py_compile app.py

      - name: Build backend image
        shell: bash
        run: |
          echo "=== BUILDING BACKEND ==="
          docker build --no-cache \
            -t ai-smart-library-backend:latest \
            ./backend

      - name: Verify backend image
        shell: bash
        run: |
          echo "=== BACKEND IMAGE ==="
          docker image inspect ai-smart-library-backend:latest
          docker images ai-smart-library-backend

      - name: Replace backend container
        shell: bash
        run: |
          echo "=== STARTING BACKEND ==="

          docker rm -f smart-library-backend 2>/dev/null || true

          docker network create smart-library-network 2>/dev/null || true

          docker run -d \
            --name smart-library-backend \
            --network smart-library-network \
            -p 5000:5000 \
            ai-smart-library-backend:latest

      - name: Wait for backend
        shell: bash
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo
              echo "Backend is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Backend failed health check."
          docker logs smart-library-backend
          exit 1

      - name: Backend logs
        if: always()
        shell: bash
        run: |
          docker logs smart-library-backend || true

      - name: Cleanup unused build cache
        if: success()
        shell: bash
        run: |
          echo "=== CLEANING UNUSED BUILD CACHE ==="
          docker builder prune -f

  frontend-build:
    name: Frontend Build
    runs-on: self-hosted
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version
          echo "=== DOCKER SERVER ==="
          docker version --format 'Docker Server: {{.Server.Version}}'
          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Build frontend image
        shell: bash
        run: |
          echo "=== BUILDING FRONTEND ==="

          docker build --no-cache \
            -t ai-smart-library-frontend:latest \
            ./frontend

      - name: Verify frontend image
        shell: bash
        run: |
          echo "=== FRONTEND IMAGE ==="
          docker image inspect ai-smart-library-frontend:latest
          docker images ai-smart-library-frontend

      - name: Replace frontend container
        shell: bash
        run: |
          echo "=== STARTING FRONTEND ==="

          docker rm -f smart-library-frontend 2>/dev/null || true

          docker run -d \
            --name smart-library-frontend \
            --network smart-library-network \
            -p 8080:80 \
            ai-smart-library-frontend:latest

      - name: Test frontend
        shell: bash
        run: |
          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Frontend is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Frontend failed health check."
          docker logs smart-library-frontend
          exit 1

      - name: Frontend logs
        if: always()
        shell: bash
        run: |
          docker logs smart-library-frontend || true

      - name: Docker status
        if: always()
        shell: bash
        run: |
          echo "=== RUNNING CONTAINERS ==="
          docker ps

          echo "=== DISK USAGE ==="
          docker system df

      - name: Cleanup unused build cache
        if: success()
        shell: bash
        run: |
          echo "=== CLEANING UNUSED BUILD CACHE ==="
          docker builder prune -f
