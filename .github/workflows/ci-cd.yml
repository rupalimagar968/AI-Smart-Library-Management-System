name: Smart Library CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Check
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version

          echo "=== DOCKER SERVER ==="
          docker info --format 'Docker Server: {{.ServerVersion}}'

          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Validate Backend
        shell: bash
        run: |
          echo "=== PYTHON SYNTAX CHECK ==="

          docker run --rm \
            -v "$PWD/backend:/app" \
            -w /app \
            python:3.11-slim \
            python -m py_compile app.py

          echo "Backend Python syntax OK."

      - name: Build Backend
        shell: bash
        run: |
          echo "=== BUILDING BACKEND ==="

          docker build --no-cache \
            -t ai-smart-library-backend:latest \
            ./backend

      - name: Remove Old Backend Application Container
        shell: bash
        run: |
          docker rm -f smart-library-backend 2>/dev/null || true

      - name: Start Backend
        shell: bash
        run: |
          docker run -d \
            --name smart-library-backend \
            -p 5000:5000 \
            ai-smart-library-backend:latest

      - name: Backend Health Check
        shell: bash
        run: |
          echo "=== BACKEND HEALTH CHECK ==="

          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo ""
              echo "Backend is healthy."
              exit 0
            fi

            echo "Waiting for backend... attempt $i/30"
            sleep 2
          done

          echo "Backend health check FAILED."

          docker logs smart-library-backend || true

          exit 1

      - name: Backend Logs
        if: always()
        shell: bash
        run: |
          docker logs smart-library-backend || true


  frontend-build:
    name: Frontend Build
    runs-on: self-hosted

    needs:
      - backend-build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Check
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version

          echo "=== DOCKER SERVER ==="
          docker info --format 'Docker Server: {{.ServerVersion}}'

          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Build Frontend
        shell: bash
        run: |
          echo "=== BUILDING FRONTEND ==="

          docker build --no-cache \
            -t ai-smart-library-frontend:latest \
            ./frontend

      - name: Remove Old Frontend Application Container
        shell: bash
        run: |
          docker rm -f smart-library-frontend 2>/dev/null || true

      - name: Start Frontend
        shell: bash
        run: |
          docker run -d \
            --name smart-library-frontend \
            -p 8080:80 \
            ai-smart-library-frontend:latest

      - name: Frontend Health Check
        shell: bash
        run: |
          echo "=== FRONTEND HEALTH CHECK ==="

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Frontend is healthy."
              exit 0
            fi

            echo "Waiting for frontend... attempt $i/30"
            sleep 2
          done

          echo "Frontend health check FAILED."

          docker logs smart-library-frontend || true

          exit 1

      - name: Frontend Logs
        if: always()
        shell: bash
        run: |
          docker logs smart-library-frontend || true


  cleanup:
    name: Safe Docker Cleanup
    runs-on: self-hosted

    needs:
      - backend-build
      - frontend-build

    if: success()

    steps:

      - name: Verify MySQL Is Untouched
        shell: bash
        run: |
          echo "=== MYSQL PROTECTION CHECK ==="

          if docker image inspect mysql:8.0 >/dev/null 2>&1; then
            echo "mysql:8.0 image exists."
          else
            echo "WARNING: mysql:8.0 image not found."
          fi

          echo "=== MYSQL CONTAINERS ==="
          docker ps -a --filter "ancestor=mysql:8.0"

      - name: Remove Stopped Containers
        shell: bash
        run: |
          echo "=== REMOVING STOPPED CONTAINERS ==="

          docker container prune -f

      - name: Remove Dangling Images Only
        shell: bash
        run: |
          echo "=== REMOVING DANGLING IMAGES ONLY ==="

          docker image prune -f

      - name: Remove Unused Build Cache
        shell: bash
        run: |
          echo "=== REMOVING UNUSED BUILD CACHE ==="

          docker builder prune -f

      - name: Verify MySQL Image
        shell: bash
        run: |
          echo "=== MYSQL IMAGE AFTER CLEANUP ==="

          docker image inspect mysql:8.0 \
            --format 'MySQL image exists: {{.RepoTags}}'

      - name: Final Docker Usage
        shell: bash
        run: |
          echo "=== FINAL DOCKER USAGE ==="

          docker system df

          echo "=== RUNNING CONTAINERS ==="

          docker ps
