name: Smart Library CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Information
        shell: powershell
        run: |
          Write-Host "=== DOCKER VERSION ==="
          docker version
          Write-Host "=== DOCKER CONTEXT ==="
          docker context show

      - name: Python Syntax Check
        shell: powershell
        run: |
          Write-Host "=== PYTHON SYNTAX CHECK ==="
          python --version
          python -m py_compile backend/app.py
          Write-Host "Python syntax OK"

      - name: Build Backend Image
        shell: powershell
        run: |
          Write-Host "=== BUILDING BACKEND ==="
          docker build --no-cache `
            -t ai-smart-library-backend:latest `
            ./backend

          Write-Host "Backend image build SUCCESS"

      - name: Test Backend Container
        shell: powershell
        run: |
          Write-Host "=== START BACKEND TEST CONTAINER ==="

          docker rm -f smart-library-backend-ci 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No old backend CI container found"
          }

          docker run -d `
            --name smart-library-backend-ci `
            -p 5001:5000 `
            ai-smart-library-backend:latest

          Write-Host "Waiting for backend..."

          $healthy = $false

          for ($i = 1; $i -le 30; $i++) {

            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:5001/api/health" `
                -UseBasicParsing `
                -TimeoutSec 3

              if ($response.StatusCode -eq 200) {
                Write-Host "Backend health check SUCCESS"
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Waiting... attempt $i/30"
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            Write-Host "Backend health check FAILED"
            docker logs smart-library-backend-ci
            exit 1
          }

          Write-Host "=== BACKEND HEALTH RESPONSE ==="
          Invoke-WebRequest `
            -Uri "http://localhost:5001/api/health" `
            -UseBasicParsing

      - name: Cleanup Backend Test Container
        if: always()
        shell: powershell
        run: |
          Write-Host "=== CLEANING TEMPORARY BACKEND TEST CONTAINER ==="
          docker rm -f smart-library-backend-ci 2>$null
          Write-Host "Temporary backend container removed"

  frontend-build:
    name: Frontend Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Image
        shell: powershell
        run: |
          Write-Host "=== BUILDING FRONTEND ==="

          docker build --no-cache `
            -t ai-smart-library-frontend:latest `
            ./frontend

          Write-Host "Frontend build SUCCESS"

  cleanup:
    name: Docker Cleanup
    runs-on: self-hosted

    needs:
      - backend-build
      - frontend-build

    if: always()

    steps:
      - name: Docker Cleanup
        shell: powershell
        run: |
          Write-Host "=== DOCKER DISK USAGE BEFORE CLEANUP ==="
          docker system df

          Write-Host "=== STOPPED CONTAINERS ONLY ==="
          docker container prune -f

          Write-Host "=== UNUSED BUILD CACHE ONLY ==="
          docker builder prune -af

          Write-Host "=== UNUSED NETWORKS ONLY ==="
          docker network prune -f

          Write-Host "=== DANGLING IMAGES ONLY ==="
          docker image prune -f

          Write-Host "=== DOCKER DISK USAGE AFTER CLEANUP ==="
          docker system df

          Write-Host "=== RUNNING CONTAINERS ==="
          docker ps

          Write-Host "=== VERIFY IMPORTANT CONTAINERS ==="
          docker ps --filter "name=smart-library-mysql"
          docker ps --filter "name=smart-library-backend"
          docker ps --filter "name=smart-library-frontend"
