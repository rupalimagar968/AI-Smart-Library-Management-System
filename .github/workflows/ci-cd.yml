name: Smart Library CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend-build:
    name: Backend Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version
          echo "=== DOCKER SERVER ==="
          docker info --format 'Docker Server: {{.ServerVersion}}'
          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Python Syntax Check
        shell: bash
        run: |
          echo "=== PYTHON SYNTAX CHECK ==="
          python -m py_compile backend/app.py
          echo "Python syntax OK"

      - name: Build Backend Image
        shell: bash
        run: |
          echo "=== BUILDING BACKEND ==="
          docker build --no-cache \
            -t ai-smart-library-backend:latest \
            ./backend

      - name: Replace Backend Container
        shell: bash
        run: |
          echo "=== STOPPING OLD BACKEND ==="
          docker rm -f smart-library-backend 2>/dev/null || true

          echo "=== STARTING BACKEND ==="
          docker run -d \
            --name smart-library-backend \
            -p 5000:5000 \
            ai-smart-library-backend:latest

      - name: Backend Health Check
        shell: bash
        run: |
          echo "=== WAITING FOR BACKEND ==="
          sleep 5

          echo "=== BACKEND HEALTH ==="
          curl --fail http://localhost:5000/api/health

      - name: Backend Logs
        if: always()
        shell: bash
        run: |
          echo "=== BACKEND CONTAINER ==="
          docker ps -a --filter "name=smart-library-backend"

          echo "=== BACKEND LOGS ==="
          docker logs smart-library-backend 2>&1 || true


  frontend-build:
    name: Frontend Build
    runs-on: self-hosted
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version
          echo "=== DOCKER SERVER ==="
          docker info --format 'Docker Server: {{.ServerVersion}}'
          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Build Frontend Image
        shell: bash
        run: |
          echo "=== BUILDING FRONTEND ==="
          docker build --no-cache \
            -t ai-smart-library-frontend:latest \
            ./frontend

      - name: Replace Frontend Container
        shell: bash
        run: |
          echo "=== STOPPING OLD FRONTEND ==="
          docker rm -f smart-library-frontend 2>/dev/null || true

          echo "=== STARTING FRONTEND ==="
          docker run -d \
            --name smart-library-frontend \
            -p 8080:80 \
            ai-smart-library-frontend:latest

      - name: Frontend Health Check
        shell: bash
        run: |
          echo "=== WAITING FOR FRONTEND ==="
          sleep 5

          echo "=== FRONTEND HEALTH ==="
          curl --fail http://localhost:8080/

      - name: Frontend Logs
        if: always()
        shell: bash
        run: |
          echo "=== FRONTEND CONTAINER ==="
          docker ps -a --filter "name=smart-library-frontend"

          echo "=== FRONTEND LOGS ==="
          docker logs smart-library-frontend 2>&1 || true


  cleanup:
    name: Docker Cleanup
    runs-on: self-hosted
    needs:
      - backend-build
      - frontend-build
    if: success()

    steps:
      - name: Cleanup unused Docker resources
        shell: bash
        run: |
          echo "=== BEFORE CLEANUP ==="
          docker system df

          echo "=== REMOVE UNUSED BUILD CACHE ==="
          docker builder prune -af

          echo "=== REMOVE UNUSED IMAGES ==="
          docker image prune -f

          echo "=== AFTER CLEANUP ==="
          docker system df

          echo "=== VERIFY MYSQL IS UNTOUCHED ==="
          docker images mysql:8.0
          docker ps -a --filter "ancestor=mysql:8.0" || true

          echo "=== RUNNING CONTAINERS ==="
          docker ps
