name: MySQL Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mysql-test:
    name: MySQL Container Test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check existing MySQL
        shell: bash
        run: |
          echo "=== EXISTING MYSQL CONTAINERS ==="
          docker ps -a --filter "name=smart-library-mysql" || true

          echo "=== MYSQL IMAGE ==="
          docker images mysql:8.0 || true

      - name: Pull MySQL image if missing
        shell: bash
        run: |
          if docker image inspect mysql:8.0 >/dev/null 2>&1; then
            echo "mysql:8.0 already exists. No pull required."
          else
            echo "mysql:8.0 not found. Pulling image..."
            docker pull mysql:8.0
          fi

      - name: Start temporary MySQL test container
        shell: bash
        run: |
          echo "=== STARTING TEMPORARY MYSQL TEST CONTAINER ==="

          docker rm -f mysql-ci-test 2>/dev/null || true

          docker run -d \
            --name mysql-ci-test \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=smart_library_test \
            mysql:8.0

      - name: Wait for MySQL
        shell: bash
        run: |
          echo "=== WAITING FOR MYSQL ==="

          for i in {1..60}; do
            if docker exec mysql-ci-test \
              mysqladmin ping \
              -uroot \
              -prootpassword \
              --silent >/dev/null 2>&1; then

              echo "MySQL is ready."
              exit 0
            fi

            sleep 2
          done

          echo "MySQL failed to start."
          docker logs mysql-ci-test
          exit 1

      - name: Test MySQL database
        shell: bash
        run: |
          echo "=== TESTING MYSQL DATABASE ==="

          docker exec mysql-ci-test \
            mysql \
            -uroot \
            -prootpassword \
            -e "SELECT VERSION(); SHOW DATABASES;"

      - name: Cleanup temporary MySQL container
        if: always()
        shell: bash
        run: |
          echo "=== REMOVING ONLY TEMPORARY CI MYSQL CONTAINER ==="

          docker rm -f mysql-ci-test 2>/dev/null || true

          echo "=== VERIFYING LOCAL MYSQL WAS NOT TOUCHED ==="
          docker ps -a --filter "name=smart-library-mysql" || true

      - name: Cleanup unused build cache
        if: success()
        shell: bash
        run: |
          docker builder prune -f
