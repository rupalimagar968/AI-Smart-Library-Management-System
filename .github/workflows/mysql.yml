name: MySQL Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-test:
    name: MySQL Container Test
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Information
        shell: bash
        run: |
          echo "=== DOCKER VERSION ==="
          docker version
          echo "=== DOCKER CONTEXT ==="
          docker context show

      - name: Pull MySQL Image
        shell: bash
        run: |
          echo "=== MYSQL IMAGE ==="

          if docker image inspect mysql:8.0 >/dev/null 2>&1; then
            echo "mysql:8.0 already exists."
            echo "Existing MySQL image will NOT be removed."
          else
            docker pull mysql:8.0
          fi

      - name: Remove Old CI Container
        shell: bash
        run: |
          echo "=== REMOVE OLD CI CONTAINER ==="

          docker rm -f smart-library-mysql-ci 2>/dev/null || true

          echo "Only CI container targeted."
          echo "Local smart-library-mysql is NOT touched."

      - name: Start Fresh MySQL Container
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
        run: |
          echo "=== START MYSQL ==="

          docker run -d \
            --name smart-library-mysql-ci \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            mysql:8.0

          echo "Temporary MySQL container started."

      - name: Wait For MySQL
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "=== WAITING FOR MYSQL ==="

          for i in {1..60}; do

            if docker exec smart-library-mysql-ci \
              mysqladmin ping \
              --protocol=TCP \
              -h 127.0.0.1 \
              -uroot \
              -p"$MYSQL_ROOT_PASSWORD" \
              --silent >/dev/null 2>&1; then

              echo "MySQL is ready."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "MySQL failed to start."
              docker logs smart-library-mysql-ci || true
              exit 1
            fi

            echo "Waiting for MySQL... $i/60"
            sleep 2
          done

      - name: Test MySQL Database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
        run: |
          echo "=== TESTING MYSQL DATABASE ==="

          docker exec \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            smart-library-mysql-ci \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -uroot \
            -p"$MYSQL_ROOT_PASSWORD" \
            -e "SELECT VERSION(); SHOW DATABASES;"

          echo "MYSQL CONNECTION SUCCESS"

      - name: Verify Smart Library Database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
        run: |
          echo "=== VERIFY DATABASE ==="

          docker exec \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            smart-library-mysql-ci \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -uroot \
            -p"$MYSQL_ROOT_PASSWORD" \
            -e "USE \`$MYSQL_DATABASE\`; SELECT DATABASE();"

          echo "DATABASE VERIFICATION SUCCESS"

      - name: Test Application User
        shell: bash
        env:
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
        run: |
          echo "=== TEST APPLICATION USER ==="

          docker exec \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            smart-library-mysql-ci \
            mysql \
            --protocol=TCP \
            -h 127.0.0.1 \
            -u"$MYSQL_USER" \
            -p"$MYSQL_PASSWORD" \
            -e "USE \`$MYSQL_DATABASE\`; SELECT CURRENT_USER(); SELECT DATABASE();"

          echo "APPLICATION USER CONNECTION SUCCESS"

      - name: Cleanup Temporary MySQL
        if: always()
        shell: bash
        run: |
          echo "=== CLEANUP TEMPORARY MYSQL ==="

          docker rm -f smart-library-mysql-ci 2>/dev/null || true

          echo "Temporary CI MySQL container removed."
          echo "Local smart-library-mysql was NOT touched."

      - name: Verify Local MySQL
        if: always()
        shell: bash
        run: |
          echo "=== VERIFY LOCAL MYSQL ==="

          docker ps \
            --filter "name=smart-library-mysql" \
            --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

      - name: Cleanup Docker Build Cache
        if: always()
        shell: bash
        run: |
          echo "=== CLEAN UNUSED BUILD CACHE ==="

          docker builder prune -af

          echo "=== FINAL DOCKER USAGE ==="
          docker system df

          echo "=== RUNNING CONTAINERS ==="
          docker ps
