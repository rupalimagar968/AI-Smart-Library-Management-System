<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Smart Digital Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar light-nav">
    <div class="nav-container">
        <a href="index.html" class="brand dark-brand">
            <span class="brand-icon">📚</span>
            <span>
                <strong>Smart Library</strong>
                <small>Digital Knowledge Platform</small>
            </span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="books.html" class="active">Books</a>
            <a href="ai.html">AI Assistant</a>
        </nav>

        <a href="login.html" class="nav-login">Login →</a>
    </div>
</header>

<main class="page">

<section class="page-hero">
    <div>
        <span class="section-label">LIBRARY COLLECTION</span>
        <h1>Explore Our <span>Books</span></h1>
        <p>Search thousands of possibilities and discover your next book.</p>
    </div>

    <a href="ai.html" class="btn btn-primary">🤖 Ask AI</a>
</section>

<section class="library-panel">

    <div class="search-bar">
        <span>🔎</span>
        <input
            id="searchInput"
            type="text"
            placeholder="Search by title, author or ISBN..."
        >
        <button onclick="applyFilters()">Search</button>
    </div>

    <div class="filter-row">

        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Computer Science">Computer Science</option>
        </select>

        <select id="languageFilter">
            <option value="">All Languages</option>
            <option value="English">English</option>
        </select>

        <button class="filter-clear" onclick="clearFilters()">Clear</button>

        <button class="refresh-btn" onclick="loadBooks()">↻ Refresh</button>

    </div>

    <div id="message"></div>

    <div class="books-toolbar">
        <div>
            <strong>Library Collection</strong>
            <span id="booksCount">Loading...</span>
        </div>
    </div>

    <div id="booksGrid" class="books-grid"></div>

</section>

</main>

<footer>
    <div class="footer-inner">
        <div class="brand dark-brand">
            <span class="brand-icon">📚</span>
            <strong>Smart Digital Library</strong>
        </div>

        <p>Smart books. Smart search. Smarter learning.</p>
    </div>
</footer>

<script src="books.js"></script>

</body>
</html>
