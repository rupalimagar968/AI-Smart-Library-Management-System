<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Smart Digital Library</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .role-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            background:
                radial-gradient(circle at 15% 10%, rgba(37, 99, 235, .28), transparent 34%),
                radial-gradient(circle at 85% 90%, rgba(124, 58, 237, .24), transparent 34%),
                #071024;
        }

        .role-card {
            width: min(760px, 100%);
            padding: clamp(30px, 6vw, 64px);
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
            backdrop-filter: blur(18px);
        }

        .role-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 34px;
            font-size: 18px;
            font-weight: 700;
        }

        .role-brand span {
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            font-size: 23px;
        }

        .role-card h1 {
            margin-bottom: 10px;
            font-size: clamp(30px, 5vw, 46px);
        }

        .role-card > p {
            margin-bottom: 34px;
            color: #bdc8df;
        }

        .role-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .role-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 26px 18px;
            color: white;
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 16px;
            transition: transform .2s, background .2s, border-color .2s;
        }

        .role-option:hover {
            transform: translateY(-4px);
            background: rgba(37, 99, 235, .3);
            border-color: rgba(147, 197, 253, .7);
        }

        .role-icon {
            font-size: 34px;
        }

        .role-option strong {
            font-size: 17px;
        }

        .role-option small {
            color: #bdc8df;
        }

        @media (max-width: 520px) {
            .role-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="role-page">
    <main class="role-card">
        <div class="role-brand"><span>📚</span> Smart Library</div>
        <h1>Who are you?</h1>
        <p>Select your role to continue to the right login page.</p>

        <div class="role-options">
            <a class="role-option" href="login.html?role=user">
                <span class="role-icon">👤</span>
                <strong>User</strong>
                <small>Browse books and use the AI assistant</small>
            </a>
            <a class="role-option" href="login.html?role=admin">
                <span class="role-icon">🛡️</span>
                <strong>Admin</strong>
                <small>Manage books, users and library activity</small>
            </a>
        </div>
    </main>
</body>
</html>
